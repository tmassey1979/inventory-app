# ONE-TIME: links Expo/EAS project, commits projectId, deletes this workflow.
name: EAS Init (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eas-init
  cancel-in-progress: false

jobs:
  init:
    name: Link EAS project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set."
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialize / link EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if jq -e '.expo.extra.eas.projectId' app.json >/dev/null 2>&1; then
            echo "Already linked: $(jq -r '.expo.extra.eas.projectId' app.json)"
            exit 0
          fi

          echo "Linking project to EAS…"
          eas init --non-interactive --force 2>&1 | tee eas-init.log || true

          if ! jq -e '.expo.extra.eas.projectId' app.json >/dev/null 2>&1; then
            eas project:init --non-interactive 2>&1 | tee -a eas-init.log || true
          fi

          if ! jq -e '.expo.extra.eas.projectId' app.json >/dev/null 2>&1; then
            echo "::error::eas init did not write projectId"
            cat eas-init.log || true
            jq '.' app.json || true
            exit 1
          fi

          echo "Linked projectId: $(jq -r '.expo.extra.eas.projectId' app.json)"

      - name: Commit projectId and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f .github/workflows/eas-init.yml ]; then
            git rm -f .github/workflows/eas-init.yml
          fi
          git add app.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: link EAS projectId and remove one-time eas-init workflow"
          git push origin HEAD:main

      - name: Summary
        run: |
          {
            echo "## EAS init complete"
            if jq -e '.expo.extra.eas.projectId' app.json >/dev/null 2>&1; then
              echo "- **projectId:** \`$(jq -r '.expo.extra.eas.projectId' app.json)\`"
            fi
            echo "- Next: run **Android Preview APK**"
          } >> "$GITHUB_STEP_SUMMARY"
