name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Package job commits a version bump; [skip ci] prevents an infinite loop
permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --ci --coverage --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package:
    name: Package Android APK
    needs: test
    # Only package after successful tests on main (push or manual). Skip on PRs.
    if: >
      always() &&
      needs.test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set."
            echo "Create a token at https://expo.dev/settings/access-tokens"
            echo "Add it under Settings → Secrets and variables → Actions as EXPO_TOKEN"
            exit 1
          fi
          echo "EXPO_TOKEN is configured."

      - name: Check EAS project is linked
        run: |
          if ! jq -e '.expo.extra.eas.projectId' app.json >/dev/null 2>&1; then
            echo "::error::No EAS projectId in app.json."
            exit 1
          fi
          echo "EAS projectId: $(jq -r '.expo.extra.eas.projectId' app.json)"

      - name: Bump version (patch + versionCode)
        id: version
        run: |
          set -euo pipefail
          OLD_VER=$(jq -r '.expo.version' app.json)
          OLD_CODE=$(jq -r '.expo.android.versionCode // 1' app.json)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VER"
          PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          NEW_CODE=$((OLD_CODE + 1))

          jq --arg v "$NEW_VER" --argjson c "$NEW_CODE" \
            '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.json.tmp
          mv app.json.tmp app.json

          jq --arg v "$NEW_VER" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          TAG="android-v${NEW_VER}"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bumped ${OLD_VER} (code ${OLD_CODE}) → ${NEW_VER} (code ${NEW_CODE})"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json
          git commit -m "chore: bump version to ${NEW_VER} (versionCode ${NEW_CODE}) [skip ci]"
          git push origin HEAD:main
          echo "Committed and pushed version bump with [skip ci]"

      - name: Install dependencies
        run: npm install

      - name: Ensure icon assets exist
        run: python3 scripts/ensure_icons.py

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK (EAS preview)
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait \
            --json > eas-build-start.json

          echo "=== EAS build started ==="
          cat eas-build-start.json

          BUILD_ID=$(jq -r 'if type=="array" then .[0].id else .id end' eas-build-start.json)
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not parse EAS build id"
            cat eas-build-start.json
            exit 1
          fi
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Build ID: $BUILD_ID"

          STATUS="in-queue"
          while true; do
            eas build:view "$BUILD_ID" --json > eas-build-status.json 2>/dev/null || true
            STATUS=$(jq -r '.status // empty' eas-build-status.json | tr '[:upper:]' '[:lower:]')
            echo "Status: $STATUS"
            jq '{status, error, errorMessage, errorCode, message}' eas-build-status.json 2>/dev/null || true
            case "$STATUS" in
              finished|errored|canceled|cancelled|expired)
                break
                ;;
              *)
                sleep 30
                ;;
            esac
          done

          if [ "$STATUS" != "finished" ]; then
            echo "::error::EAS build ended with status: $STATUS"
            cat eas-build-status.json
            ERR=$(jq -r '.errorMessage // .error // .message // empty' eas-build-status.json)
            if [ -n "$ERR" ]; then
              echo "::error::EAS error: $ERR"
            fi
            exit 1
          fi

          APK_URL=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' eas-build-status.json)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::No APK download URL"
            cat eas-build-status.json
            exit 1
          fi

          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

          {
            echo "## Android preview APK"
            echo ""
            echo "- **Version:** \`${{ steps.version.outputs.version }}\` (versionCode ${{ steps.version.outputs.version_code }})"
            echo "- **Build ID:** \`$BUILD_ID\`"
            echo "- **Download APK:** [$APK_URL]($APK_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download APK to runner
        env:
          APK_URL: ${{ env.APK_URL }}
        run: |
          curl -fsSL -o inventory-manager-preview.apk "$APK_URL"
          ls -lh inventory-manager-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-preview-apk
          path: inventory-manager-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dragon Inventory Android ${{ steps.version.outputs.version }}
          body: |
            Standalone Android APK — **does not require Expo Go**.

            | | |
            |---|---|
            | App version | `${{ steps.version.outputs.version }}` |
            | versionCode | `${{ steps.version.outputs.version_code }}` |
            | Workflow run | ${{ github.run_number }} |
            | Commit | `${{ github.sha }}` |
            | EAS build | `${{ env.BUILD_ID }}` |

            ### Install
            1. Download **inventory-manager-preview.apk** from the Assets below.
            2. On your phone, open the file and allow install from that source if asked.
            3. Launch **Dragon Inventory**.

            EAS URL: ${{ env.APK_URL }}
          files: inventory-manager-preview.apk
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
