name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to package after tests (main only). Use ios/all only after Apple credentials are set in Expo.
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test -- --ci --coverage --passWithNoTests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package:
    name: Package mobile builds
    needs: test
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo '::error::EXPO_TOKEN missing'; exit 1; fi
      - name: Resolve platforms
        id: platforms
        run: |
          # On push, default to Android only (iOS needs one-time Apple credentials in Expo).
          # Manual workflow_dispatch can choose ios or all.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.platforms }}"
          else
            INPUT="android"
          fi
          case "$INPUT" in
            ios) echo "list=ios" >> "$GITHUB_OUTPUT" ;;
            all) echo "list=android ios" >> "$GITHUB_OUTPUT" ;;
            *) echo "list=android" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Building: $INPUT"
      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          OLD_VER=$(jq -r .expo.version app.json)
          OLD_CODE=$(jq -r '.expo.android.versionCode // 1' app.json)
          OLD_IOS=$(jq -r '.expo.ios.buildNumber // "1"' app.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$OLD_VER"
          PATCH=$((PATCH+1)); NEW_VER="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((OLD_CODE+1)); NEW_IOS=$((OLD_IOS+1))
          jq --arg v "$NEW_VER" --argjson c "$NEW_CODE" --arg ib "$NEW_IOS" \
            '.expo.version=$v | .expo.android.versionCode=$c | .expo.ios.buildNumber=$ib' app.json > t && mv t app.json
          jq --arg v "$NEW_VER" '.version=$v' package.json > t && mv t package.json
          echo version=$NEW_VER >> $GITHUB_OUTPUT
          echo version_code=$NEW_CODE >> $GITHUB_OUTPUT
          echo ios_build=$NEW_IOS >> $GITHUB_OUTPUT
          echo tag=v$NEW_VER >> $GITHUB_OUTPUT
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.json package.json
          git commit -m "chore: bump version to $NEW_VER (android $NEW_CODE, ios $NEW_IOS) [skip ci]"
          git push origin HEAD:main
      - run: npm install
      - run: python3 scripts/ensure_icons.py
      - run: npm install -g eas-cli
      - name: EAS builds
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORMS: ${{ steps.platforms.outputs.list }}
        run: |
          set -uo pipefail
          FAILED=""
          for PLATFORM in $PLATFORMS; do
            echo "::group::EAS $PLATFORM"
            if ! eas build --platform "$PLATFORM" --profile preview --non-interactive --no-wait --json > "eas-start-$PLATFORM.json"; then
              echo "::warning::$PLATFORM failed to start"
              cat "eas-start-$PLATFORM.json" || true
              if [ "$PLATFORM" = "android" ]; then exit 1; fi
              FAILED="$FAILED $PLATFORM(start)"
              continue
            fi
            BUILD_ID=$(jq -r 'if type=="array" then .[0].id else .id end' "eas-start-$PLATFORM.json")
            if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
              echo "::error::no build id for $PLATFORM"
              cat "eas-start-$PLATFORM.json" || true
              if [ "$PLATFORM" = "android" ]; then exit 1; fi
              FAILED="$FAILED $PLATFORM(id)"
              continue
            fi
            echo "${PLATFORM}_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
            STATUS="in_queue"
            while true; do
              eas build:view "$BUILD_ID" --json > "eas-status-$PLATFORM.json" || true
              STATUS=$(jq -r '.status // empty' "eas-status-$PLATFORM.json" | tr '[:upper:]' '[:lower:]')
              echo "$PLATFORM $STATUS"
              case "$STATUS" in finished|errored|canceled|cancelled|expired) break ;; *) sleep 30 ;; esac
            done
            if [ "$STATUS" != "finished" ]; then
              echo "::warning::$PLATFORM build status: $STATUS"
              cat "eas-status-$PLATFORM.json" || true
              if [ "$PLATFORM" = "ios" ]; then
                echo "::warning::iOS needs Apple credentials configured once: npx eas-cli credentials -p ios"
              fi
              if [ "$PLATFORM" = "android" ]; then exit 1; fi
              FAILED="$FAILED $PLATFORM($STATUS)"
              continue
            fi
            ART=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' "eas-status-$PLATFORM.json")
            if [ -z "$ART" ] || [ "$ART" = "null" ]; then
              echo "::warning::no artifact URL for $PLATFORM"
              if [ "$PLATFORM" = "android" ]; then exit 1; fi
              FAILED="$FAILED $PLATFORM(url)"
              continue
            fi
            echo "${PLATFORM}_URL=$ART" >> "$GITHUB_ENV"
            echo "::endgroup::"
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          if echo "$FAILED" | grep -q ios; then
            echo "::warning::iOS did not produce a build; Android will still be published if available."
          fi
      - name: Download artifacts
        run: |
          mkdir -p dist
          if [ -n "${android_URL:-}" ]; then
            curl -fsSL -o dist/DragonInventory-android.apk "$android_URL"
            ls -lh dist/DragonInventory-android.apk
          fi
          if [ -n "${ios_URL:-}" ]; then
            curl -fsSL -o dist/DragonInventory-ios.ipa "$ios_URL"
            ls -lh dist/DragonInventory-ios.ipa
          fi
          ls -la dist || true
          if [ ! -f dist/DragonInventory-android.apk ] && [ ! -f dist/DragonInventory-ios.ipa ]; then
            echo "::error::No platform artifacts produced"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/DragonInventory-android.apk') != ''
        with:
          name: android-preview-apk
          path: dist/DragonInventory-android.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/DragonInventory-ios.ipa') != ''
        with:
          name: ios-preview-ipa
          path: dist/DragonInventory-ios.ipa
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dragon Inventory ${{ steps.version.outputs.version }}
          body: |
            Preview builds (no Expo Go).

            | | |
            |---|---|
            | Version | `${{ steps.version.outputs.version }}` |
            | Android versionCode | `${{ steps.version.outputs.version_code }}` |
            | iOS buildNumber | `${{ steps.version.outputs.ios_build }}` |

            **Android:** install the APK from Assets (or the workflow artifact).

            **iOS:** requires Apple Developer credentials in Expo (`eas credentials -p ios`) and registered device UDIDs for internal distribution.
          files: |
            dist/DragonInventory-android.apk
            dist/DragonInventory-ios.ipa
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
