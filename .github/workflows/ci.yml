name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to package after tests (main only)
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test -- --ci --coverage --passWithNoTests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package:
    name: Package mobile builds
    needs: test
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo '::error::EXPO_TOKEN missing'; exit 1; fi
      - name: Resolve platforms
        id: platforms
        run: |
          INPUT="${{ github.event.inputs.platforms || 'all' }}"
          case "$INPUT" in android) echo list=android >> $GITHUB_OUTPUT ;; ios) echo list=ios >> $GITHUB_OUTPUT ;; *) echo 'list=android ios' >> $GITHUB_OUTPUT ;; esac
      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          OLD_VER=$(jq -r .expo.version app.json)
          OLD_CODE=$(jq -r '.expo.android.versionCode // 1' app.json)
          OLD_IOS=$(jq -r '.expo.ios.buildNumber // "1"' app.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$OLD_VER"
          PATCH=$((PATCH+1)); NEW_VER="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((OLD_CODE+1)); NEW_IOS=$((OLD_IOS+1))
          jq --arg v "$NEW_VER" --argjson c "$NEW_CODE" --arg ib "$NEW_IOS" \
            '.expo.version=$v | .expo.android.versionCode=$c | .expo.ios.buildNumber=$ib' app.json > t && mv t app.json
          jq --arg v "$NEW_VER" '.version=$v' package.json > t && mv t package.json
          echo version=$NEW_VER >> $GITHUB_OUTPUT
          echo version_code=$NEW_CODE >> $GITHUB_OUTPUT
          echo ios_build=$NEW_IOS >> $GITHUB_OUTPUT
          echo tag=v$NEW_VER >> $GITHUB_OUTPUT
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.json package.json
          git commit -m "chore: bump version to $NEW_VER (android $NEW_CODE, ios $NEW_IOS) [skip ci]"
          git push origin HEAD:main
      - run: npm install
      - run: python3 scripts/ensure_icons.py
      - run: npm install -g eas-cli
      - name: EAS builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORMS: ${{ steps.platforms.outputs.list }}
        run: |
          set -euo pipefail
          for PLATFORM in $PLATFORMS; do
            eas build --platform "$PLATFORM" --profile preview --non-interactive --no-wait --json > eas-start-$PLATFORM.json
            BUILD_ID=$(jq -r 'if type=="array" then .[0].id else .id end' eas-start-$PLATFORM.json)
            if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = null ]; then echo "::error::no build id"; cat eas-start-$PLATFORM.json; exit 1; fi
            echo "${PLATFORM}_BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
            while true; do
              eas build:view "$BUILD_ID" --json > eas-status-$PLATFORM.json || true
              STATUS=$(jq -r '.status // empty' eas-status-$PLATFORM.json | tr A-Z a-z)
              echo "$PLATFORM $STATUS"
              case "$STATUS" in finished|errored|canceled|cancelled|expired) break ;; *) sleep 30 ;; esac
            done
            if [ "$STATUS" != finished ]; then
              echo "::error::$PLATFORM failed: $STATUS"; cat eas-status-$PLATFORM.json
              if [ "$PLATFORM" = ios ]; then echo '::error::iOS needs Apple Developer credentials in Expo (eas credentials)'; fi
              exit 1
            fi
            ART=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' eas-status-$PLATFORM.json)
            echo "${PLATFORM}_URL=$ART" >> $GITHUB_ENV
          done
      - name: Download artifacts
        run: |
          mkdir -p dist
          if [ -n "${android_URL:-}" ]; then curl -fsSL -o dist/DragonInventory-android.apk "$android_URL"; fi
          if [ -n "${ios_URL:-}" ]; then curl -fsSL -o dist/DragonInventory-ios.ipa "$ios_URL"; fi
          ls -la dist || true
      - uses: actions/upload-artifact@v4
        if: env.android_URL != ''
        with:
          name: android-preview-apk
          path: dist/DragonInventory-android.apk
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: env.ios_URL != ''
        with:
          name: ios-preview-ipa
          path: dist/DragonInventory-ios.ipa
          if-no-files-found: ignore
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Dragon Inventory ${{ steps.version.outputs.version }}
          body: |
            Preview builds (no Expo Go).
            Version ${{ steps.version.outputs.version }} | Android ${{ steps.version.outputs.version_code }} | iOS ${{ steps.version.outputs.ios_build }}
            Android: install the APK. iOS: IPA needs Apple Developer + registered devices.
          files: |
            dist/DragonInventory-android.apk
            dist/DragonInventory-ios.ipa
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
